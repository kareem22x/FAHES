# pnpm workspace configuration for the fahes app.
#
# ── Why this file exists ─────────────────────────────────────────────────────
#
# pnpm refuses to run a dependency's install scripts unless it is explicitly
# named here, and — since the stricter releases — it *fails the install* when a
# script is skipped without being declared:
#
#     ERR_PNPM_IGNORED_BUILDS: Ignored build scripts: core-js, unrs-resolver
#
# That error is what broke every Vercel deployment. The previous workaround was
# `pnpm install --ignore-scripts` in vercel.json, which silently skipped *all*
# scripts; once pnpm started treating an undeclared skip as an error, the same
# command began failing the build instead.
#
# ── The trap ─────────────────────────────────────────────────────────────────
#
# pnpm **v11 removed** `onlyBuiltDependencies`, `onlyBuiltDependenciesFile`,
# `neverBuiltDependencies`, `ignoredBuiltDependencies` and `ignoreDepScripts`,
# replacing them all with a single `allowBuilds` **map**. Listing a package
# under the old keys does nothing in pnpm 12 — it is silently ignored, so the
# build script stays "undeclared" and the install still fails.
#
# ── Why BOTH spellings are declared ──────────────────────────────────────────
#
# `package.json` pins `packageManager: pnpm@12.3.4`, so `allowBuilds` is the
# live setting. But the two spellings are read by disjoint toolchain
# generations, and each generation ignores the other's keys rather than
# rejecting them:
#
#   pnpm >= 11  reads `allowBuilds`              (ignores the two lists)
#   pnpm <= 10  reads the two lists              (ignores `allowBuilds`)
#
# Declaring both means the install succeeds no matter which pnpm the CI image
# happens to resolve, at the cost of a few redundant lines. The alternative —
# guessing the CI's pnpm version and being wrong — is what produced four
# consecutive failed deployments.
#
# The decision per package is the same either way:
#
#   * `@tailwindcss/oxide` — the native Tailwind v4 scanner. MUST build.
#   * `core-js`            — its postinstall only prints a funding banner.
#   * `unrs-resolver`      — native resolver used only by ESLint's import
#                            plugin. Its postinstall is the one that fails on
#                            Vercel, and the production build does not lint.
minimumReleaseAgeExclude:
  - '@next/*'
  - next

# pnpm >= 11
allowBuilds:
  '@tailwindcss/oxide': true
  core-js: true
  unrs-resolver: false

# pnpm <= 10
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js

ignoredBuiltDependencies:
  - unrs-resolver
